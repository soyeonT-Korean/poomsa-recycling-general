<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>품사 분리수거</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

<!-- ══════ 타이틀 ══════ -->
<section class="screen on hero" id="s-home">
  <div class="eyebrow">중학교 1학년 · 국어 · 품사</div>
  <div class="titlerow">
    <h1 id="titleTap">품사<em>분리수거</em></h1>
    <svg class="titleicon" viewBox="200 48 280 180" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <g transform="rotate(-34 236 132)"><rect x="228" y="126" width="72" height="10" rx="4" fill="#1C4ED8"/><rect x="256" y="119" width="17" height="7" rx="3" fill="#1C4ED8"/></g>
      <path d="M300 108 C303 124 303 132 301 141" fill="none" stroke="#A9B0BA" stroke-width="1.5" stroke-dasharray="3 4" stroke-linecap="round"/>
      <g transform="rotate(-11 300 86)"><rect x="266" y="62" width="68" height="46" rx="6" fill="#FFFFFF" stroke="#14161A" stroke-width="2.5"/><rect x="278" y="76" width="30" height="9" rx="3" fill="#FFE066"/><rect x="278" y="90" width="44" height="5" rx="2.5" fill="#D6DAE0"/></g>
      <path d="M235 152 L299 152 L292 206 L242 206 Z" fill="#2563EB"/>
      <ellipse cx="267" cy="152" rx="32" ry="7" fill="#16326E"/>
      <ellipse cx="267" cy="150" rx="32" ry="7" fill="#3B7BF5"/>
      <ellipse cx="267" cy="150" rx="25" ry="4.5" fill="#16326E"/>
      <g transform="translate(267,180) scale(1.15)" fill="#FFFFFF" opacity="0.85"><g><path d="M-9 7 L3 7" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/><polygon points="9,7 2.5,3.4 2.5,10.6"/></g><g transform="rotate(120)"><path d="M-9 7 L3 7" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/><polygon points="9,7 2.5,3.4 2.5,10.6"/></g><g transform="rotate(240)"><path d="M-9 7 L3 7" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/><polygon points="9,7 2.5,3.4 2.5,10.6"/></g></g>
      <path d="M313 152 L377 152 L370 206 L320 206 Z" fill="#E8590C"/>
      <rect x="309" y="142" width="72" height="10" rx="4" fill="#C24907"/>
      <rect x="336" y="135" width="17" height="7" rx="3" fill="#C24907"/>
      <g transform="translate(345,180) scale(1.15)" fill="#FFFFFF" opacity="0.85"><g><path d="M-9 7 L3 7" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/><polygon points="9,7 2.5,3.4 2.5,10.6"/></g><g transform="rotate(120)"><path d="M-9 7 L3 7" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/><polygon points="9,7 2.5,3.4 2.5,10.6"/></g><g transform="rotate(240)"><path d="M-9 7 L3 7" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/><polygon points="9,7 2.5,3.4 2.5,10.6"/></g></g>
      <path d="M391 152 L455 152 L448 206 L398 206 Z" fill="#0CA678"/>
      <rect x="387" y="142" width="72" height="10" rx="4" fill="#08865F"/>
      <rect x="414" y="135" width="17" height="7" rx="3" fill="#08865F"/>
      <g transform="translate(423,180) scale(1.15)" fill="#FFFFFF" opacity="0.85"><g><path d="M-9 7 L3 7" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/><polygon points="9,7 2.5,3.4 2.5,10.6"/></g><g transform="rotate(120)"><path d="M-9 7 L3 7" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/><polygon points="9,7 2.5,3.4 2.5,10.6"/></g><g transform="rotate(240)"><path d="M-9 7 L3 7" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/><polygon points="9,7 2.5,3.4 2.5,10.6"/></g></g>
    </svg>
  </div>
  <p>다른 데서 못 구함. 용강중학교, 너희를 위한 전용 게임.</p>

  <div id="streakTag" class="streakTag"></div>

  <div class="reviewBar" id="reviewBar"></div>

  <div class="sectionDivider">단계별 훈련</div>
  <div class="map" id="map"></div>

  <button class="resetProg" id="resetProg" type="button">이 기기 기록 초기화</button>

  <div class="legend">
    <div><i style="background:var(--che)"></i>체언</div>
    <div><i style="background:var(--yong)"></i>용언</div>
    <div><i style="background:var(--susik)"></i>수식언</div>
    <div><i style="background:var(--gwan)"></i>관계언</div>
    <div><i style="background:var(--dok)"></i>독립언</div>
  </div>
</section>

<!-- ══════ 게임 ══════ -->
<section class="screen" id="s-play">
  <div class="bar">
    <span class="lv" id="lvTag">1단계</span>
    <div class="belt" id="belt"></div>
    <span class="score" id="score">0</span>
    <button class="exit" id="exitBtn">나가기</button>
  </div>

  <div class="stagearea">
    <div class="combo" id="combo"></div>
    <div id="cardSlot"></div>
  </div>

  <div class="bins" id="bins"></div>
</section>

<!-- ══════ 결과 ══════ -->
<section class="screen result" id="s-done">
  <div style="text-align:center">
    <div class="eyebrow" id="doneLv">1단계</div>
    <h2 id="doneTitle">선별 완료</h2>
    <div class="bigscore" id="doneScore">0<span>점</span></div>
    <div style="font-size:14px;font-weight:800;color:var(--ink-2);margin-top:6px" id="doneRate"></div>
  </div>
  <div class="stats">
    <h3>다시 볼 것</h3>
    <div id="wrongList"></div>
  </div>
  <div class="actions" id="doneActions"></div>
</section>

<!-- ══════ 품사 한눈에 보기 ══════ -->
<section class="screen" id="s-ref">
  <div class="refHead">
    <h2>품사 한눈에 보기</h2>
    <button class="btn ghost" id="refBack" type="button">닫기</button>
  </div>
  <div id="refBody"></div>
</section>

<!-- ══════ 모달(비밀번호 / 초기화 확인) ══════ -->
<div class="modalOverlay" id="pwModal">
  <div class="modalBox">
    <div class="modalTitle">교사용 비밀번호</div>
    <input type="password" id="pwInput" inputmode="numeric" class="modalInput" placeholder="비밀번호 입력">
    <div class="modalErr" id="pwErr">비밀번호가 틀렸어요.</div>
    <div class="modalActions">
      <button class="btn ghost" id="pwCancel" type="button">취소</button>
      <button class="btn" id="pwOk" type="button">확인</button>
    </div>
  </div>
</div>

<div class="modalOverlay" id="resetModal">
  <div class="modalBox">
    <div class="modalTitle">이 기기에 저장된 진행 기록을<br>모두 지울까요?</div>
    <div class="modalActions">
      <button class="btn ghost" id="resetCancel" type="button">취소</button>
      <button class="btn" id="resetOk" type="button">지우기</button>
    </div>
  </div>
</div>

</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
